<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerdikT3 - Platform Pembelajaran Tingkatan 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-graduation-cap"></i> CerdikT3</h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">KSSM Tingkatan 3</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <section class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Selamat Datang ke CerdikT3!</h2>
            <p class="text-slate-600">Ulang kaji subjek Tingkatan 3 mengikut silibus buku teks KPM dengan mudah di rumah.</p>
        </section>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-blue-100 text-blue-600 p-4 rounded-lg text-xl"><i class="fa-solid fa-calculator"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Matematik T3</h3>
                    <p class="text-sm text-slate-500">Indeks, Pola, S&R, Graf</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-green-100 text-green-600 p-4 rounded-lg text-xl"><i class="fa-solid fa-atom"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Sains T3</h3>
                    <p class="text-sm text-slate-500">Rangsangan, Respirasi, Tenaga</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-amber-100 text-amber-600 p-4 rounded-lg text-xl"><i class="fa-solid fa-landmark"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Sejarah T3</h3>
                    <p class="text-sm text-slate-500">Kuasa Luar & Nasionalisme</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-rose-100 text-rose-600 p-4 rounded-lg text-xl"><i class="fa-solid fa-book-open"></i></div>
                <div>
                    <h3 class="font-bold text-lg">Bahasa Melayu</h3>
                    <p class="text-sm text-slate-500">Tatabahasa & Karangan</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
